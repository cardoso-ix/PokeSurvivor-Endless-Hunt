server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento instantâneo
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Headers de Segurança Básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Service Worker e manifesto PWA (sempre atualizados)
    location ~* (sw\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # HTML principal (sempre consulta a versão mais recente)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos com cache longo e eficiente (Sprites, Áudio, Fontes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|ogg|mp3|wav|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Roteamento SPA e subpastas (guia, pokedex, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck para monitoramento do Coolify / Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
