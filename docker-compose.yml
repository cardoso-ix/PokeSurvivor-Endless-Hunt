version: '3.8'

services:
  pokesurvivor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokesurvivor-app
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
